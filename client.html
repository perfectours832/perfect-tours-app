<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c3554">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
<title>החופשה שלי | Perfect Tours</title>
</head>
<body class="client-body">
<div id="loading" class="loading-screen"><div class="spinner"></div><p>טוען את החופשה שלכם...</p></div>
<div id="clientApp" hidden>
<header class="client-hero" id="top">
  <div class="client-top"><div class="eyebrow">PERFECT TOURS</div><button class="icon-btn" id="installBtn" hidden>התקנה</button></div>
  <h1 id="destinationTitle"></h1><p id="greeting"></p><div class="countdown" id="countdown"></div>
</header>
<main class="client-main">
  <section class="quick-grid">
    <a id="hotelNav" class="quick-card" target="_blank">📍<span>ניווט למלון</span></a>
    <a id="whatsappHelp" class="quick-card" target="_blank">💬<span>שירות בוואטסאפ</span></a>
    <button class="quick-card" id="shareBtn">📲<span>שיתוף</span></button>
  </section>
  <section class="client-card"><span class="eyebrow">פרטי החופשה</span>
    <div class="info-grid">
      <div><small>תאריכים</small><strong id="tripDates">—</strong></div>
      <div><small>מספר הזמנה</small><strong id="bookingNumberView">—</strong></div>
      <div><small>טיסת הלוך</small><strong id="outboundView">—</strong></div>
      <div><small>טיסת חזור</small><strong id="returnView">—</strong></div>
      <div class="full"><small>מלון</small><strong id="hotelView">—</strong></div>
    </div>
  </section>
  <section class="client-card"><span class="eyebrow">הודעה מפרפקט טורס</span><p id="welcomeView" class="welcome-message"></p></section>
  <section class="client-card"><span class="eyebrow">התוכנייה שלכם</span><h2>מה עושים בכל יום</h2><div id="itineraryView" class="timeline"></div></section>
  <section class="client-card"><span class="eyebrow">מסמכים</span><h2>כל מה שצריך לנסיעה</h2><div id="documentsView" class="documents"></div></section>
</main>
<nav class="bottom-nav">
  <a href="#top">🏠<span>בית</span></a><a href="#itineraryView">📅<span>תוכנייה</span></a>
  <a href="#documentsView">🎫<span>מסמכים</span></a><a id="bottomWhatsapp" target="_blank">💬<span>שירות</span></a>
</nav>
</div>
<div id="errorState" class="landing" hidden><section class="brand-card"><h1>הקישור אינו זמין</h1><p>פנו לפרפקט טורס לקבלת קישור חדש.</p></section></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script><script src="client.js"></script>
</body>
</html>
